name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      # .python-version pins 3.12 for development, and uv follows it unless
      # told otherwise: without this, `uv python install 3.11` installed an
      # interpreter that `uv sync` and `uv run` then never used, and the
      # "3.11" jobs ran 3.12. UV_PYTHON takes precedence over the file for
      # every uv command in the job.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          # The cache key is derived from the runner's system Python, not
          # the one uv installs, so parallel jobs would collide on save.
          cache-suffix: ${{ github.job }}-py${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (core + dev + mcp, no MLX)
        run: uv sync --extra dev --extra mcp

      - name: Assert the job runs the Python it is named after
        run: |
          uv run python -c "import sys; want = tuple(int(n) for n in '${{ matrix.python-version }}'.split('.')); assert sys.version_info[:2] == want, (sys.version, want)"

      - name: Run test suite (engine + top-level)
        run: uv run pytest

      - name: Run examples (smoke)
        env:
          MPLBACKEND: Agg
        run: |
          uv run python examples/data/make_example_data.py
          uv run python examples/01_fit_single_spectrum.py
          uv run python examples/02_chemical_state_map.py
          uv run python examples/03_quantification.py
          uv run python examples/04_projection_law_validation.py
          uv run python examples/05_fit_map_from_file.py
          uv run python examples/06_fermi_edge_calibration.py
          uv run python examples/07_width_identifiability_map.py

  lint:
    name: ruff
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          cache-suffix: ${{ github.job }}
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/ examples/

  build:
    name: build + clean-install smoke + metadata
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          cache-suffix: ${{ github.job }}
      - run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build -o dist/

      - name: Assert archives contain no private or local files
        run: |
          set -e
          tar tzf dist/*.tar.gz > sdist_contents.txt
          unzip -l dist/*.whl > wheel_contents.txt

          # NOTE: do not write these as `! grep ...`. `set -e` explicitly
          # does not exit when a command's status is inverted with `!`, so
          # that form matches, prints the offending path, and passes
          # anyway. These guards were inert until 2026-07-30.
          fail=0
          deny() {  # deny <description> <extended-regex>
            if grep -iE "$2" sdist_contents.txt wheel_contents.txt; then
              echo "::error::$1 must not ship (pattern: $2)"
              fail=1
            fi
          }
          deny "Private development layers" \
               'toyomacro/(gui|api|agent|piar|depth|outputs)/'
          deny "Local agent/control files" \
               'AGENTS\.md|\.codex/|JOSS_IMPLEMENTATION_BRIEF|CLAUDE'
          deny "Maintainer notes (handoffs, drafts, specs)" \
               '_internal/'
          deny "Vendor analyzer-transmission data" \
               'Slit[0-9]+p[0-9]+_spot|ScientaXOP'

          # Guard the guard: the patterns above are worthless if the
          # contents listings are empty or unwritten.
          for f in sdist_contents.txt wheel_contents.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty — the archive listing failed"
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "archive contents clean"

      - name: Install built wheel into a clean env and smoke-test
        run: |
          uv venv /tmp/cleanenv
          uv pip install --python /tmp/cleanenv/bin/python dist/*.whl
          /tmp/cleanenv/bin/python -c "
          import numpy as np
          import toyomacro, toyomacro.voigtfit as vf
          assert toyomacro.__version__ == vf.__version__
          from toyomacro.voigtfit.weight_cache import WeightMatrixCache
          from toyomacro.voigtfit.pipeline import HybridPipeline
          cache = WeightMatrixCache()
          Wt, Phi = cache.get_or_create('Si', '2p', np.linspace(-5, 5, 101),
                                        np.array([0.0]), np.array([0.6]), 0.2)
          pipe = HybridPipeline(cache=cache, use_mlx=True, enable_stage2=False)
          Y = np.asarray(Phi) @ np.array([[7.0]])
          A, chi2 = pipe.stage1_screening(Y, Wt, Phi)
          assert abs(float(np.asarray(A)[0, 0]) - 7.0) < 1e-2
          print('clean-install smoke OK, version', toyomacro.__version__)
          "

      - name: Validate CITATION.cff
        run: uvx cffconvert --validate

      - name: Regenerate Figure 1 from the committed measurement record
        run: |
          uv sync --extra dev
          uv run python paper/figures/make_figure1_bottleneck.py
          test -f paper/figures/figure1_bottleneck.png

  mlx-disabled:
    name: headless-Mac simulation (MLX installed, Metal disabled)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          cache-suffix: ${{ github.job }}
      - run: uv python install 3.12
      - name: Install with MLX extra
        run: uv sync --extra dev --extra mcp --extra mlx
      - name: Full suite with MLX force-disabled
        env:
          TOYOMACRO_DISABLE_MLX: "1"
        run: uv run pytest -q

  paper:
    name: JOSS paper compiles
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: joss-paper
          path: paper/paper.pdf

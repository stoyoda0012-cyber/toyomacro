name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (core + dev + mcp, no MLX)
        run: uv sync --extra dev --extra mcp

      - name: Run test suite (engine + top-level)
        run: uv run pytest

      - name: Run examples (smoke)
        env:
          MPLBACKEND: Agg
        run: |
          uv run python examples/01_fit_single_spectrum.py
          uv run python examples/02_chemical_state_map.py
          uv run python examples/03_quantification.py
          uv run python examples/04_projection_law_validation.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/ examples/
